<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUTV - Production Calendar</title>

    <meta name="description" content="The full WUTV production calendar — shoots, meetings, screenings and events for WashU's student-run television network.">
    <link rel="canonical" href="https://joel-cpu-dev.github.io/wutv/calendar.html">
    <meta name="theme-color" content="#0D1B2A">

    <link rel="icon" type="image/png" sizes="96x96" href="assets/img/logo-96.png">
    <link rel="apple-touch-icon" href="assets/img/logo-256.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://calendar.google.com">

    <link rel="stylesheet" href="assets/site.css?v=4">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;family=VT323&amp;display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;family=VT323&amp;display=swap"></noscript>

    <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('wutv_theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

    <script src="assets/site.js?v=3" defer></script>
</head>
<body class="antialiased h-screen flex flex-col">

    <div class="film-grain" aria-hidden="true"></div>
    <div class="custom-cursor" id="cursor" aria-hidden="true"></div>

    <!-- DIRECTOR'S VIEWFINDER OVERLAY -->
    <div id="rec-overlay" class="fixed inset-0 pointer-events-none z-[9990] opacity-0 transition-opacity duration-500 hidden" aria-hidden="true">
        <div class="absolute inset-8 border border-white/20"></div>
        <div class="absolute inset-12 border-2 border-white/40"></div>
    </div>

    <!-- HEADER / BACK BUTTON -->
    <div class="max-w-7xl w-full mx-auto px-6 md:px-8 pt-12 flex justify-between items-center mb-8 flex-shrink-0 gap-4">
        <a href="index.html" class="interactive flex items-center gap-2 text-white/70 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span class="font-bold uppercase tracking-wider text-xs md:text-sm">Back to Home</span>
        </a>
        <h1 class="text-2xl md:text-3xl font-bold tracking-widest text-white">Production Calendar</h1>
    </div>

    <!-- CALENDAR IFRAME -->
    <section class="px-6 md:px-8 pb-12 max-w-7xl w-full mx-auto flex-grow flex flex-col">
        <div class="surface-box rounded-2xl overflow-hidden p-2 flex-grow flex shadow-2xl">
            <!-- Loaded on demand by assets/site.js so the third-party calendar
                 bundle never blocks this page's first paint. -->
            <iframe title="WUTV Production Calendar"
                    data-src="https://calendar.google.com/calendar/embed?src=ddbd1becfd788a44828e9e0cd80d74e7157369dad4c80b54bc65a0a67163ea90%40group.calendar.google.com&amp;ctz=America%2FChicago"
                    loading="lazy" width="100%" height="100%"
                    class="rounded-xl filter invert hue-rotate-180 opacity-90 w-full h-full min-h-[600px] interactive"></iframe>
        </div>
        <noscript>
            <p class="text-center text-sm opacity-80 mt-4">
                Enable JavaScript to view the embedded calendar, or
                <a href="https://calendar.google.com/calendar/embed?src=ddbd1becfd788a44828e9e0cd80d74e7157369dad4c80b54bc65a0a67163ea90%40group.calendar.google.com&amp;ctz=America%2FChicago" class="underline">open it directly in Google Calendar</a>.
            </p>
        </noscript>
    </section>

</body>
</html>
